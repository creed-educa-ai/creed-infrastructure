# Produção na EC2 (ADR-0007): Caddy na frente; back, Keycloak e N8N atrás. O banco
# é o RDS — nenhum Postgres sobe aqui.
#
# Na EC2 este arquivo roda de /opt/creed/creed-infrastructure/ec2, com o
# creed-backend clonado ao lado (/opt/creed/creed-backend) e o .env desta pasta
# sendo um link para /opt/creed/.env. Passo a passo no README desta pasta.

# Fixa o nome do projeto, que é o prefixo dos volumes (creed_caddy_data). Nome
# novo = volume novo = certificado novo pedido ao Let's Encrypt, que emite no
# máximo 5 iguais por semana.
name: creed

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Editor do N8N, atrás de senha (Caddyfile). Precisa da regra 5679 no
      # security group.
      - "5679:5679"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_HASH: ${N8N_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Onde o certificado mora. Nunca apague.
      - caddy_data:/data
      - caddy_config:/config

  keycloak:
    # Mesma versão do docker-compose local do creed-backend.
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # `start` é o modo produção. O realm só é importado se ainda não existir no
    # banco: mudança no arquivo depois disso não chega sozinha.
    command: start --import-realm
    # A instância tem 2 GB. Sem teto, a JVM toma ~70% da RAM da máquina inteira;
    # com ele, ~70% deste valor.
    mem_limit: 1g
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=require
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # O RDS db.t4g.micro aceita ~100 conexões, e o padrão do Keycloak (100)
      # tomaria todas — sem sobrar para o back e o N8N.
      KC_DB_POOL_MAX_SIZE: 10

      # Atrás do Caddy, que cuida do HTTPS e repassa /auth para cá.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${PUBLIC_HOST}/auth
      # O console de admin não passa pelo Caddy: só por túnel SSH
      # (ssh -L 18080:localhost:8080 creed-ec2 → http://localhost:18080/auth/admin).
      KC_HOSTNAME_ADMIN: http://localhost:18080/auth
      # Admin TEMPORÁRIO, só para a primeira subida. Sem valor de propósito: o
      # compose repassa a variável do .env se ela existir e a omite se não existir.
      # Com `${...}`, ela chegaria VAZIA depois de apagada do .env, e o Keycloak 26
      # recusa subir com nome de admin sem senha (ficou em loop em 2026-10-15).
      KC_BOOTSTRAP_ADMIN_USERNAME:
      KC_BOOTSTRAP_ADMIN_PASSWORD:

      # Placeholders do realm-creed.json (README do creed-backend).
      CREED_BACKEND_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      CREED_REALM_SSL_REQUIRED: external
    # Só na própria máquina, para o túnel do console. A internet chega pelo Caddy.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../creed-backend/docker/keycloak/realm-creed.json:/opt/keycloak/data/import/realm-creed.json:ro

  n8n:
    # Versão fixa, a mesma do docker-compose local do creed-backend. `latest`
    # trocaria de versão sozinho a cada `pull`, sem ninguém ler o que mudou.
    image: n8nio/n8n:2.43.4
    restart: unless-stopped
    mem_limit: 768m
    environment:
      # Workflows, usuários e credenciais ficam no RDS, no schema `n8n` — que o
      # próprio N8N cria (o creed_app tem CREATE no banco).
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      # O RDS exige SSL. Criptografa sem validar a cadeia do certificado da AWS —
      # o mesmo que o sslmode=require do Keycloak.
      DB_POSTGRESDB_SSL_ENABLED: "true"
      DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"

      # Chave que criptografa as credenciais salvas nos workflows (chaves de LLM).
      # Perdida, as credenciais ficam ilegíveis: guardada também no Parameter Store.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # O editor é aberto pelo Caddy, em https://<IP>:5679.
      N8N_PROTOCOL: https
      N8N_HOST: ${PUBLIC_HOST}
      N8N_EDITOR_BASE_URL: https://${PUBLIC_HOST}:5679
      N8N_PROXY_HOPS: 1
      # A URL de webhook que o editor mostra é a que o back usa: a da rede interna.
      WEBHOOK_URL: http://n8n:5678/

      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
    # Só na própria máquina: plano B por túnel, se o Caddy estiver fora.
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      # Único estado fora do RDS (ADR-0007): chaves locais e arquivos do N8N.
      # Nunca apague — e entra no backup do disco.
      - n8n_data:/home/node/.n8n

  back:
    # Imagem gerada pelo workflow imagem.yml do creed-backend a cada push na main.
    # BACK_TAG é o commit que está no ar: quem grava no .env é o deploy.sh, e só
    # depois de a migration passar. Não edite à mão.
    image: ghcr.io/creed-educa-ai/creed-backend:${BACK_TAG:-main}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # O back fala com o Keycloak pela rede interna; o token sai com o endereço
      # público, e é por ele que o `iss` é conferido (CREED-283).
      KEYCLOAK_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_PUBLIC_URL: https://${PUBLIC_HOST}/auth
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # Domínio do front no Amplify, quando existir. Vazio = nenhum navegador de
      # outro endereço consegue chamar a API.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # A integração com o N8N ainda não existe no back: N8N_WEBHOOK_URL
      # (http://n8n:5678/webhook/...) e N8N_CALLBACK_SECRET entram com ela.
    # Sem porta publicada: a internet chega pelo Caddy, em /api.

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
