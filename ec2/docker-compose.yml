# Produção na EC2 (ADR-0007): Caddy na frente; back, Keycloak e N8N atrás, e o
# worker de insights ao lado do back. O banco é o RDS — nenhum Postgres sobe aqui.
#
# Na EC2 este arquivo roda de /opt/creed/creed-infrastructure/ec2, com o
# creed-backend clonado ao lado (/opt/creed/creed-backend) e o .env desta pasta
# sendo um link para /opt/creed/.env. Passo a passo no README desta pasta.

# Fixa o nome do projeto, que é o prefixo dos volumes (creed_caddy_data). Nome
# novo = volume novo = certificado novo pedido ao Let's Encrypt, que emite no
# máximo 5 iguais por semana.
name: creed

services:
  caddy:
    image: caddy:2.11
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      # Editor do N8N, atrás de senha (Caddyfile). Precisa da regra 5679 no
      # security group.
      - "5679:5679"
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_HASH: ${N8N_BASIC_AUTH_HASH}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Onde o certificado mora. Nunca apague.
      - caddy_data:/data
      - caddy_config:/config

  keycloak:
    # Mesma versão do docker-compose local do creed-backend.
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    # `start` é o modo produção. O realm só é importado se ainda não existir no
    # banco: mudança no arquivo depois disso não chega sozinha.
    command: start --import-realm
    # Sem teto, a JVM toma ~70% da RAM da máquina inteira; com ele, ~70% deste
    # valor. A instância tem 4 GB (t4g.medium, desde 2026-10-28).
    mem_limit: 1g
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=require
      KC_DB_SCHEMA: keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # O RDS db.t4g.micro aceita ~100 conexões, e o padrão do Keycloak (100)
      # tomaria todas — sem sobrar para o back e o N8N.
      KC_DB_POOL_MAX_SIZE: 10

      # Atrás do Caddy, que cuida do HTTPS e repassa /auth para cá.
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /auth
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME: https://${PUBLIC_HOST}/auth
      # O console de admin não passa pelo Caddy: só por túnel SSH
      # (ssh -L 18080:localhost:8080 creed-ec2 → http://localhost:18080/auth/admin).
      KC_HOSTNAME_ADMIN: http://localhost:18080/auth
      # Admin TEMPORÁRIO, só para a primeira subida. Sem valor de propósito: o
      # compose repassa a variável do .env se ela existir e a omite se não existir.
      # Com `${...}`, ela chegaria VAZIA depois de apagada do .env, e o Keycloak 26
      # recusa subir com nome de admin sem senha (ficou em loop em 2026-10-15).
      KC_BOOTSTRAP_ADMIN_USERNAME:
      KC_BOOTSTRAP_ADMIN_PASSWORD:

      # Placeholders do realm-creed.json (README do creed-backend). O import só os
      # lê quando o realm nasce. No realm que já existe, quem aplica estes valores
      # é o realm/aplicar-ajustes.sh, que os lê daqui (README, "Ajustar o realm").
      CREED_BACKEND_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      CREED_REALM_SSL_REQUIRED: external
      # SMTP do Gmail do projeto (adendo do ADR-0006). auth, starttls e ssl são
      # fixos: na 587, o Gmail só aceita login depois do STARTTLS.
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_AUTH: "true"
      SMTP_STARTTLS: "true"
      SMTP_SSL: "false"
      # Redirect aceito pelo client creed-backend: o link "voltar" do convite
      # leva ao front (P-051).
      CREED_FRONTEND_URL: ${FRONTEND_URL}
    # Só na própria máquina, para o túnel do console. A internet chega pelo Caddy.
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../../creed-backend/docker/keycloak/realm-creed.json:/opt/keycloak/data/import/realm-creed.json:ro
      # Tema das páginas que a pessoa vê no Keycloak (definir a senha) e do e-mail
      # do convite, do mesmo clone. Em modo produção o Keycloak guarda o tema em
      # cache: depois de um `git pull` que mude a pasta, `docker compose restart
      # keycloak` (README).
      - ../../creed-backend/docker/keycloak/themes/creed:/opt/keycloak/themes/creed:ro

  n8n:
    # Versão fixa, a mesma do docker-compose local do creed-backend. `latest`
    # trocaria de versão sozinho a cada `pull`, sem ninguém ler o que mudou.
    image: n8nio/n8n:2.43.4
    restart: unless-stopped
    # Em 2026-10-28 o N8N travou com "JavaScript heap out of memory" com 768m: o
    # Node limita o heap a ~metade do container (408 MB), e o processo principal
    # já usa ~350 MB parado. O container tem dois processos Node (o principal e
    # o task runner, ~120 MB), e os dois contam neste limite. Por isso o heap é
    # fixado à mão (NODE_OPTIONS) e o limite deixa ~500 MB para o resto.
    # Registro completo no diário de campo, 2026-10-28.
    mem_limit: 1536m
    environment:
      NODE_OPTIONS: --max-old-space-size=1024

      # Workflows, usuários e credenciais ficam no RDS, no schema `n8n` — que o
      # próprio N8N cria (o creed_app tem CREATE no banco).
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT}
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      # O RDS exige SSL. Criptografa sem validar a cadeia do certificado da AWS —
      # o mesmo que o sslmode=require do Keycloak.
      DB_POSTGRESDB_SSL_ENABLED: "true"
      DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: "false"

      # Chave que criptografa as credenciais salvas nos workflows (chaves de LLM).
      # Perdida, as credenciais ficam ilegíveis: guardada também no Parameter Store.
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}

      # O editor é aberto pelo Caddy, em https://<IP>:5679.
      N8N_PROTOCOL: https
      N8N_HOST: ${PUBLIC_HOST}
      N8N_EDITOR_BASE_URL: https://${PUBLIC_HOST}:5679
      N8N_PROXY_HOPS: 1
      # A URL de webhook que o editor mostra é a que o back usa: a da rede interna.
      WEBHOOK_URL: http://n8n:5678/

      GENERIC_TIMEZONE: America/Sao_Paulo
      TZ: America/Sao_Paulo
      N8N_DIAGNOSTICS_ENABLED: "false"
    # Só na própria máquina: plano B por túnel, se o Caddy estiver fora.
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      # Único estado fora do RDS (ADR-0007): chaves locais e arquivos do N8N.
      # Nunca apague — e entra no backup do disco.
      - n8n_data:/home/node/.n8n

  back:
    # Imagem gerada pelo workflow imagem.yml do creed-backend a cada push na main.
    # BACK_TAG é o commit que está no ar: quem grava no .env é o deploy.sh, e só
    # depois de a migration passar. Não edite à mão.
    # Sem BACK_TAG, a tag reserva não existe de propósito: o pull falha com o
    # próprio nome dizendo o que fazer, em vez de subir uma imagem (como a :main)
    # que pode nunca ter passado pela migration.
    image: ghcr.io/creed-educa-ai/creed-backend:${BACK_TAG:-rode-o-deploy-sh}
    restart: unless-stopped
    mem_limit: 384m
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # O back fala com o Keycloak pela rede interna; o token sai com o endereço
      # público, e é por ele que o `iss` é conferido (CREED-283).
      KEYCLOAK_SERVER_URL: http://keycloak:8080/auth
      KEYCLOAK_PUBLIC_URL: https://${PUBLIC_HOST}/auth
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      # Domínio do front no Amplify, quando existir. Vazio = nenhum navegador de
      # outro endereço consegue chamar a API.
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # O back monta <FRONTEND_URL>/login no convite, como destino do link
      # "voltar" (P-051). Vazio desliga o link.
      FRONTEND_URL: ${FRONTEND_URL}
      # Validade do link do convite. Sem valor de propósito, como o
      # KC_BOOTSTRAP_ADMIN_* do Keycloak: fora do .env vale o padrão do back
      # (72 h, P-049). Com `${...}`, chegaria vazia, e o back não sobe com um
      # número vazio.
      KEYCLOAK_INVITE_LIFESPAN_SECONDS:

      # Esteira de insights. O N8N devolve o texto em /api/v1/insights/callback, pela
      # rede interna: o Caddy responde 404 a esse caminho vindo de fora. O segredo
      # confere a assinatura da volta. Vazio, a rota recusa tudo com 401. O token
      # da ida NÃO vem para cá: quem chama o N8N é o worker, e quem assina é o N8N.
      # O `:-` só cala o aviso "variable is not set" do compose: texto vazio é válido
      # para o back, como no CORS_ORIGINS.
      N8N_CALLBACK_SECRET: ${N8N_CALLBACK_SECRET:-}
      # Sem valor de propósito, como o KC_BOOTSTRAP_ADMIN_* do Keycloak: o compose
      # repassa se o .env tiver e omite se não tiver, e vale o padrão do back. Com
      # `${...:-}` chegaria vazia, e o back não sobe com um número vazio. Tem que
      # ser o mesmo valor do worker: o callback também confere o limite de tentativas.
      INSIGHT_MAX_ATTEMPTS:
    # Sem porta publicada: a internet chega pelo Caddy, em /api.

  insight-worker:
    # Mesma imagem e mesma tag do back, com outro comando (ADR-0010). O deploy.sh
    # recria os dois juntos, depois da migration, então os dois rodam sempre o mesmo
    # commit. Mudou a imagem de um? Mude a do outro. O comentário do `back` explica
    # por que a tag reserva não existe.
    image: ghcr.io/creed-educa-ai/creed-backend:${BACK_TAG:-rode-o-deploy-sh}
    command: python -m app.workers.insights
    restart: unless-stopped
    # Sem servidor web: só o loop, o SQLAlchemy e o httpx. Ainda não medido em
    # produção: se `docker stats` chegar perto do teto, ou o container reiniciar
    # sozinho (OOM), suba este valor.
    mem_limit: 192m
    # O SIGTERM deixa o ciclo em curso terminar. Com o N8N fora, um ciclo leva até
    # INSIGHT_WORKER_BATCH_SIZE × N8N_TIMEOUT_SECONDS (5 × 10 s), e com os 10 s
    # padrão do Docker o SIGKILL chegaria no meio, deixando o pedido `dispatched`
    # até a varredura devolvê-lo à fila. É o mesmo valor do compose local do
    # creed-backend: mudou um dos dois, reveja este.
    stop_grace_period: 1m
    environment:
      ENVIRONMENT: production
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # O worker não usa o Keycloak, mas a config do back exige este valor para
      # subir: sem ele o container cai no boot e reinicia em loop.
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}

      # O N8N pela rede interna, o mesmo endereço que o editor mostra em WEBHOOK_URL.
      # O token vai no `Authorization: Bearer` da ida. Vazio, o worker avisa
      # "esteira desligada" no log e não mexe em nenhum pedido. Comentado no .env é o
      # estado normal até o workflow existir (README): o `:-` evita o aviso de
      # variável ausente a cada comando do compose, inclusive no log do deploy.
      N8N_WEBHOOK_URL: http://n8n:5678/webhook/creed/insights/v1
      N8N_WEBHOOK_TOKEN: ${N8N_WEBHOOK_TOKEN:-}
      # O ritmo. Sem valor, mesmo motivo do INSIGHT_MAX_ATTEMPTS do back: vale o
      # padrão do back, e o .env muda um deles. O INSIGHT_MAX_IN_FLIGHT é o único
      # regulador contra a cota do Bedrock, que ainda não se conhece.
      INSIGHT_WORKER_INTERVAL_SECONDS:
      INSIGHT_WORKER_BATCH_SIZE:
      INSIGHT_MAX_IN_FLIGHT:
      INSIGHT_MAX_ATTEMPTS:
      INSIGHT_DISPATCH_TIMEOUT_SECONDS:
    # Sem porta publicada e sem nada na frente: ninguém chama o worker, é ele que
    # chama o N8N.

volumes:
  caddy_data:
  caddy_config:
  n8n_data:
