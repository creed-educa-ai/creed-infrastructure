# ════════════════════════════════════════════════════════════════════
# APOSENTADO em 2026-09-12 pelo ADR-0007 — NADA CONSOME ESTE ARQUIVO.
#
# O projeto saiu de EKS para Amplify (front) + uma EC2 (back, N8N e
# Keycloak em containers). Não há cluster, não há Helm, não há pods.
#
# A REGRA CONTINUA VALENDO: migration nunca roda no startup do
# container. O mecanismo é que mudou — hoje é um passo do pipeline, que
# sobe um container descartável com `alembic upgrade head` e só recria
# o container do back se ele terminar com codigo 0.
#
# Mantido versionado como referência: se um dia aparecer dono de infra
# e necessidade de cluster, este manifesto é o ponto de partida e o
# ADR-0007 explica o que custaria voltar.
# ════════════════════════════════════════════════════════════════════
#
# Job de migration (ADR-002, secao 2.4.d).
#
# POR QUE UM JOB E NÃO NO STARTUP DO CONTAINER:
# no EKS, múltiplos pods da aplicação sobem em paralelo. Se a migration
# rodasse no startup, várias instâncias tentariam migrar o mesmo banco
# simultaneamente — corrida clássica que corrompe o estado do schema.
# Este Job roda UMA vez e só então os pods da aplicação sobem.
#
# No Helm, usar as hooks abaixo para garantir a ordem no deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: creed-backend-migrate
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 2
  template:
    metadata:
      name: creed-backend-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - configMapRef:
                name: creed-backend-config
            - secretRef:
                name: creed-backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
